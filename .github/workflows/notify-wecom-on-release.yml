name: notify-wecom-on-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要补发的 Release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  call-notify-wecom:
    uses: TDesignOteam/workflows/.github/workflows/reusable-notify-wecom.yml@main
    with:
      tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    secrets:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
